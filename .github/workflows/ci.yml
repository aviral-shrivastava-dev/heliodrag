name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests/ -q

  pipeline:
    # Builds and tests every dbt model against a synthetic fixture. No API
    # credentials are involved, so the full transformation layer is verified on
    # every pull request rather than only on a developer's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic bronze
        run: python -m starlink_drag.fixtures_cli
        env:
          PYTHONPATH: src

      - name: dbt deps
        working-directory: dbt
        run: dbt deps
        env:
          DBT_PROFILES_DIR: .

      - name: dbt build against fixtures
        working-directory: dbt
        run: >
          dbt build
          --vars '{gp_history_path: ../data/fixtures/bronze/gp_history,
                   omni_path: ../data/fixtures/bronze/omni,
                   interim_path: ../data/fixtures/interim}'
        env:
          DBT_PROFILES_DIR: .

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt/target/
          retention-days: 7
