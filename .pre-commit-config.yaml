# Run on every commit: `make setup` installs the hook.
# Run over everything: `pre-commit run --all-files`.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"] # dbt YAML uses Jinja
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(uv\.lock|\.env\.example)$

  - repo: local
    hooks:
      # Raw Space-Track data is covered by a US-government data-use agreement.
      # Derived products only -- never the source extracts.
      - id: no-data-directory
        name: refuse to commit anything under data/
        entry: data/ is gitignored and must never be committed
        language: fail
        files: ^data/
