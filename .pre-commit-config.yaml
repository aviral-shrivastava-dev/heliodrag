# Run on every commit: `make setup` installs the hook.
# Run over everything: `pre-commit run --all-files`.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # 2 MB, to admit transform/seeds/starlink_generation_map.csv (~1.2 MB):
        # a reference table of 12,440 satellites derived from GCAT, which is
        # CC-BY and therefore redistributable. The guard against committing
        # actual pipeline data is the no-data-directory hook below, not this.
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"] # dbt YAML uses Jinja
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Lockfiles and the example env carry no secrets. package-lock.yml's
        # only high-entropy string is dbt's sha1 checksum of packages.yml, and
        # the file is regenerated by `dbt deps`, so an inline pragma would not
        # survive.
        exclude: ^(uv\.lock|\.env\.example|transform/package-lock\.yml)$

  - repo: local
    hooks:
      # Raw Space-Track data is covered by a US-government data-use agreement.
      # Derived products only -- never the source extracts.
      - id: no-data-directory
        name: refuse to commit anything under data/
        entry: data/ is gitignored and must never be committed
        language: fail
        files: ^data/
