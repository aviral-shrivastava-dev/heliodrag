# Local stack: Dagster UI plus a Kafka-compatible broker for the streaming layer.
#
# Redpanda rather than Kafka: same API, single binary, no ZooKeeper/KRaft setup,
# and it runs comfortably in ~1 GB. For a single-developer project the operational
# difference is large and the API difference is nil.

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: starlink-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: redpandadata/console:v2.7.2
    container_name: starlink-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092

  dagster:
    build: .
    container_name: starlink-dagster
    command: >
      dagster dev
      -m starlink_drag.orchestration.definitions
      --host 0.0.0.0
      --port 3000
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/home
      PYTHONPATH: /app/src
      KAFKA_BOOTSTRAP: redpanda:29092
    env_file:
      - path: .env
        required: false
    volumes:
      # Bind-mounted so a backfill's output survives the container and stays
      # inspectable from the host with DuckDB.
      - ./data:/app/data
      - ./src:/app/src
      - ./dbt:/app/dbt
      - dagster-home:/opt/dagster/home

volumes:
  dagster-home:
