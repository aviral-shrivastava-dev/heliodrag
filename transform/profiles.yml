# Committed deliberately: it contains no secrets. The DuckDB file lives under
# data/, which is gitignored.
#
# DUCKDB_PATH should be absolute. The default below is relative and only works
# when dbt is invoked from the repository root, which the Makefile does but
# Dagster does not -- dagster-dbt runs dbt from the project directory, so the
# dbt asset sets an absolute DUCKDB_PATH before invoking it.
starlink_drag:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/atlas.duckdb') }}"
      # One model at a time, so each gets the whole memory budget below. DuckDB
      # already parallelises inside each query; four dbt threads made four heavy
      # queries share one budget.
      threads: 1
      extensions:
        - httpfs
        - parquet
      settings:
        # DuckDB assumes it may use 80% of RAM and spills to disk only past its
        # own limit. On a laptop with other programs open, the operating system
        # runs out first: on 2026-09-26, with ~30M element sets, three tests on
        # int_decay__daily_rates failed with "Out of Memory Error: Allocation
        # failure" while 12 GB was nominally allowed and 4.5 GB was free. An
        # honest limit makes DuckDB spill to data/atlas.duckdb.tmp instead --
        # for what can spill; see int_gp__deduplicated for what could not.
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '4GB') }}"
        # Reuse HTTP connections to a remote lake. Without it every Parquet file
        # read opens its own, and on the full history dbt's tests ran the
        # container out of local ports. Same as starlink_drag.lake's
        # DUCKDB_REMOTE_SETTINGS; harmless with a local lake.
        httpfs_connection_caching: true
      secrets:
        # How DuckDB reaches an S3-compatible lake (LAKE_BACKEND=r2): SeaweedFS
        # in infra/docker, or Cloudflare R2. The bronze views store s3:// paths,
        # not keys, so every connection needs this. starlink_drag.lake builds
        # these variables from the settings and passes them to dbt; with a
        # local lake the secret exists and is simply never used.
        - type: s3
          key_id: "{{ env_var('LAKE_ACCESS_KEY_ID', '') }}"
          secret: "{{ env_var('LAKE_SECRET_ACCESS_KEY', '') }}"
          endpoint: "{{ env_var('LAKE_S3_ENDPOINT', 's3.amazonaws.com') }}"
          region: "{{ env_var('LAKE_REGION', 'auto') }}"
          use_ssl: "{{ env_var('LAKE_S3_USE_SSL', 'true') }}"
          url_style: path

    ci:
      # Ephemeral database seeded from tests/fixtures; never the real warehouse.
      type: duckdb
      path: "data/ci.duckdb"
      threads: 2
      extensions:
        - parquet
