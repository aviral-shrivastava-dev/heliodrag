version: 2

models:
  - name: fct_v2_drag_response
    description: >
      Conditioned analysis panel for the V2 Mini natural experiment: the three
      variants share an identical 29 m span while differing in dry mass by 1.67x.
      Excludes orbit-raising days, the first 45 days after launch, null decay
      rates, and peer groups smaller than three. Produces the panel a regression
      is fitted to rather than fitting one, so the modelling choices stay visible
      in SQL.

      KNOWN LIMITATION: operational Starlink satellites station-keep, so
      `decay_rate_km_per_day` is the residual after thrust, not pure atmospheric
      drag -- roughly 48% of operational satellite-days show altitude gain. The
      variants also occupy different altitude shells (DTC at 325-350 km, the
      others at 425-550 km), so the three-way comparison is weaker than the
      identical span suggests. See README.
    columns:
      - name: norad_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_satellite')
              field: norad_id
      - name: generation
        tests:
          - not_null
          - accepted_values:
              values: ["v2-mini", "v2-mini-opt", "v2-mini-dtc"]
      - name: span_m
        description: Constant by construction; the experiment depends on it.
        tests:
          - accepted_values:
              values: [29.0]
              quote: false
      - name: excess_decay_km_per_day
        description: Decay relative to the same shell on the same day.
        tests:
          - not_null
      - name: storm_class
        tests:
          - accepted_values:
              values: ["quiet", "weak", "moderate", "intense", "severe"]
      - name: shell_day_satellites
        tests:
          - dbt_utils.accepted_range:
              min_value: 3
              inclusive: true
