version: 2
models:
- name: fct_catalogue_coverage
  description: 'Daily audit of how many observed satellites resolve to a generation. GCAT curates new
    launches with roughly ten weeks of lag, so recent days legitimately show unmatched satellites -- always
    the newest variant. This model exists so that loss is measured rather than silently inner-joined away.

    '
  columns:
  - name: observation_date
    tests:
    - not_null
    - unique
  - name: coverage_pct
    tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 100
