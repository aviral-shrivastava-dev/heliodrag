version: 2

models:
  - name: stg_gp_history
    description: >
      Typed, deduplicated view over bronze GP-history partitions. Space-Track
      occasionally re-issues a record for an epoch it already published, so the
      same (norad_id, epoch) can appear in more than one partition; the most
      recently loaded copy wins.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [norad_id, epoch]
    columns:
      - name: norad_id
        tests: [not_null]
      - name: epoch
        tests: [not_null]

  - name: stg_omni
    description: >
      Typed view over bronze OMNI with fill sentinels nulled and Kp rescaled from
      the server's Kp x 10 integer encoding.
    columns:
      - name: observed_at
        tests: [not_null, unique]
      - name: kp
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 9
              config:
                where: "kp is not null"
