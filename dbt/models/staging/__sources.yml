version: 2

sources:
  - name: bronze
    description: >
      Raw vendor payloads on disk as partitioned parquet, written by the Python
      loaders and never edited in place. dbt-duckdb's `external_location` points a
      source at files rather than a warehouse table, so bronze stays a plain
      lakehouse directory while still appearing in dbt lineage and freshness
      checks.
    tables:
      - name: gp_history
        description: >
          Space-Track GP element sets, one partition per UTC day. Append-only;
          the same (norad_id, epoch) may be republished, which stg_gp_history
          deduplicates.
        meta:
          external_location: >
            read_parquet('{{ var("gp_history_path") }}/**/*.parquet',
                         hive_partitioning = true, union_by_name = true)
        columns:
          - name: NORAD_CAT_ID
            description: NORAD catalogue number.
          - name: EPOCH
            description: Element set epoch, UTC.
          - name: SEMIMAJOR_AXIS
            description: Semi-major axis in km, from which decay rate is derived.

      - name: omni
        description: >
          NASA OMNI hourly space weather, one partition per year. Fill sentinels
          are preserved verbatim here and nulled in staging.
        meta:
          external_location: >
            read_parquet('{{ var("omni_path") }}/**/*.parquet',
                         hive_partitioning = true, union_by_name = true)
        columns:
          - name: time
            description: Observation timestamp, UTC.
          - name: KP1800
            description: Kp x 10 as an integer; rescaled in staging.

  - name: interim
    description: >
      Outputs of Python steps whose logic does not belong in SQL -- currently the
      satellite generation map, which needs mass-band classification and a
      validation suite that runs against externally known facts.
    tables:
      - name: starlink_generation_map
        description: NORAD ID to Starlink hardware generation, built from GCAT.
        meta:
          external_location: >
            read_parquet('{{ var("interim_path") }}/starlink_generation_map.parquet')
        columns:
          - name: norad_id
            description: Join key to all orbital data.
          - name: generation
            description: v0.9 | v1.0 | v1.5 | v2-mini | v2-mini-opt | v2-mini-dtc
