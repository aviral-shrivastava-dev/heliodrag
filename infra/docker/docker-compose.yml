# Local stack: the lake, and Dagster on top of it.
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# MinIO stands in for Cloudflare R2. Both speak the S3 API, so the only thing
# that changes between local and production is the endpoint and the
# credentials -- which is the point of LAKE_BACKEND.
#
# Credentials here are local-only defaults and deliberately obvious. Real ones
# live in .env, which is gitignored; nothing in this file is a secret.

name: starlink-drag-atlas

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LAKE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${LAKE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Creates the bucket once MinIO is accepting connections, then exits. A
  # one-shot container rather than an entrypoint script, so a failure to create
  # the bucket is visible as a failed container instead of a silent warning.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      LAKE_BUCKET: ${LAKE_BUCKET:-starlink-drag-atlas}
      LAKE_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY_ID:-minioadmin}
      LAKE_SECRET_ACCESS_KEY: ${LAKE_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set lake http://minio:9000 \"$$LAKE_ACCESS_KEY_ID\" \"$$LAKE_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing \"lake/$$LAKE_BUCKET\" &&
      mc ls lake
      "

  dagster-webserver:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      LAKE_BACKEND: r2
      LAKE_ENDPOINT_URL: http://minio:9000
      LAKE_BUCKET: ${LAKE_BUCKET:-starlink-drag-atlas}
      LAKE_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY_ID:-minioadmin}
      LAKE_SECRET_ACCESS_KEY: ${LAKE_SECRET_ACCESS_KEY:-minioadmin}
      # Space-Track credentials are NOT defaulted. Without them the UI still
      # loads and every asset is visible; ingestion fails with a clear message.
      SPACETRACK_IDENTITY: ${SPACETRACK_IDENTITY:-}
      SPACETRACK_PASSWORD: ${SPACETRACK_PASSWORD:-}
      DUCKDB_PATH: /opt/atlas/data/atlas.duckdb
    volumes:
      - dagster-home:/opt/dagster/home
      - warehouse:/opt/atlas/data

  # Schedules and retries live in the daemon, not the webserver. Without it the
  # daily schedule never fires and the concurrency key is not enforced, which
  # is exactly the Phase 3 gap this service closes.
  dagster-daemon:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["dagster-daemon", "run", "-m", "starlink_drag.definitions"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      LAKE_BACKEND: r2
      LAKE_ENDPOINT_URL: http://minio:9000
      LAKE_BUCKET: ${LAKE_BUCKET:-starlink-drag-atlas}
      LAKE_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY_ID:-minioadmin}
      LAKE_SECRET_ACCESS_KEY: ${LAKE_SECRET_ACCESS_KEY:-minioadmin}
      SPACETRACK_IDENTITY: ${SPACETRACK_IDENTITY:-}
      SPACETRACK_PASSWORD: ${SPACETRACK_PASSWORD:-}
      DUCKDB_PATH: /opt/atlas/data/atlas.duckdb
    volumes:
      - dagster-home:/opt/dagster/home
      - warehouse:/opt/atlas/data

volumes:
  minio-data:
  dagster-home:
  warehouse:
