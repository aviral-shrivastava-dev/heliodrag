# Local stack: the lake, and Dagster on top of it.
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# The streaming path (Phase 6) is optional and off unless asked for: its
# services carry the `streaming` profile, so the command above starts exactly
# the batch stack, and this adds Redpanda, the producer, the consumer and the
# explorer (http://localhost:8501) alongside it:
#
#   docker compose -f infra/docker/docker-compose.yml --profile streaming up -d
#
# SeaweedFS stands in for Cloudflare R2. Both speak the S3 API, so the only
# thing that changes between local and production is the endpoint and the
# credentials -- which is the point of LAKE_BACKEND (see ADR-0010). It replaced
# MinIO when MinIO's free images were withdrawn (ADR-0011).
#
# Space-Track credentials come from the repository's .env, the same file the
# uv path uses. Compose would otherwise look for .env next to this file.
#
# Credentials here are local-only defaults and deliberately obvious. Real ones
# live in .env, which is gitignored; nothing in this file is a secret.

name: starlink-drag-atlas

services:
  # The lake: SeaweedFS in its all-in-one `mini` mode, serving S3 on 8333. It
  # creates the bucket itself on start (S3_BUCKET) and enforces the keys given
  # in AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY -- a request with any other
  # key is refused. Pinned to a release so it cannot change underneath the
  # pipeline. Pinning did not save MinIO: its whole repository was withdrawn,
  # pinned versions included. What catches that now is CI, which pulls this
  # image on every push.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data
    environment:
      S3_BUCKET: ${LAKE_BUCKET:-starlink-drag-atlas}
      AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY_ID:-atlas}
      AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_ACCESS_KEY:-atlas-local-only}
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # file browser: /buckets/<bucket>
    volumes:
      - lake-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8333"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  dagster-webserver:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "3000:3000"
    # Space-Track credentials, from the repository root. Without them the UI
    # still loads and every asset is visible; ingestion fails with a clear
    # message. `environment` below overrides anything here, so a .env copied
    # from .env.example cannot switch these containers back to a local lake.
    env_file:
      - path: ../../.env
        required: false
    environment:
      LAKE_BACKEND: r2
      LAKE_ENDPOINT_URL: http://seaweedfs:8333
      LAKE_BUCKET: ${LAKE_BUCKET:-starlink-drag-atlas}
      LAKE_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY_ID:-atlas}
      LAKE_SECRET_ACCESS_KEY: ${LAKE_SECRET_ACCESS_KEY:-atlas-local-only}
      DUCKDB_PATH: /opt/atlas/data/atlas.duckdb
    volumes:
      - dagster-home:/opt/dagster/home
      - warehouse:/opt/atlas/data

  # Schedules and retries live in the daemon, not the webserver. Without it the
  # daily schedule never fires and the concurrency key is not enforced, which
  # is exactly the Phase 3 gap this service closes.
  dagster-daemon:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["dagster-daemon", "run", "-m", "starlink_drag.definitions"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      LAKE_BACKEND: r2
      LAKE_ENDPOINT_URL: http://seaweedfs:8333
      LAKE_BUCKET: ${LAKE_BUCKET:-starlink-drag-atlas}
      LAKE_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY_ID:-atlas}
      LAKE_SECRET_ACCESS_KEY: ${LAKE_SECRET_ACCESS_KEY:-atlas-local-only}
      DUCKDB_PATH: /opt/atlas/data/atlas.duckdb
    volumes:
      - dagster-home:/opt/dagster/home
      - warehouse:/opt/atlas/data

  # -- The streaming path (Phase 6). Nothing above depends on anything below.

  # Kafka's API in one process: no ZooKeeper or KRaft quorum to run (ADR-0013).
  # Dev-container mode and a 512 MB budget, because it shares a laptop with
  # everything else here. Inside the stack it is redpanda:9092; from the host,
  # localhost:19092.
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    profiles: [streaming]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Space-Track at most hourly, SWPC every five minutes. Its rate-limit ledger
  # is in its own volume: it counts this container's requests, not the host's,
  # which is why it makes so few (ADR-0013).
  stream-producer:
    image: starlink-drag-atlas-stream
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.stream
    profiles: [streaming]
    command: ["starlink-drag", "stream", "produce"]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      STREAM_BOOTSTRAP_SERVERS: redpanda:9092
    volumes:
      - stream-state:/opt/atlas/data

  stream-consumer:
    image: starlink-drag-atlas-stream
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.stream
    profiles: [streaming]
    command: ["starlink-drag", "stream", "consume"]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      STREAM_BOOTSTRAP_SERVERS: redpanda:9092
      LAKE_BACKEND: r2
      LAKE_ENDPOINT_URL: http://seaweedfs:8333
      LAKE_BUCKET: ${LAKE_BUCKET:-starlink-drag-atlas}
      LAKE_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY_ID:-atlas}
      LAKE_SECRET_ACCESS_KEY: ${LAKE_SECRET_ACCESS_KEY:-atlas-local-only}
    volumes:
      - stream-state:/opt/atlas/data

  # The explorer: the batch pages read the warehouse the Dagster services build
  # (mounted read-only), the live page reads the nowcast from the lake.
  explorer:
    image: starlink-drag-atlas-stream
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.stream
    profiles: [streaming]
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      LAKE_BACKEND: r2
      LAKE_ENDPOINT_URL: http://seaweedfs:8333
      LAKE_BUCKET: ${LAKE_BUCKET:-starlink-drag-atlas}
      LAKE_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY_ID:-atlas}
      LAKE_SECRET_ACCESS_KEY: ${LAKE_SECRET_ACCESS_KEY:-atlas-local-only}
      DUCKDB_PATH: /opt/atlas/warehouse/atlas.duckdb
    volumes:
      - warehouse:/opt/atlas/warehouse:ro

volumes:
  lake-data:
  dagster-home:
  warehouse:
  redpanda-data:
  stream-state:
